name: CTW sync (dry-run only)
on:
  workflow_dispatch:
  # Enable ONLY after pilot and durable-state approval. Mon-Fri incl. holidays.
  # Weekdays 08,10,12,14,16,18 Bogota; 20 Bogota is next UTC day.
  # schedule:
  #   - cron: '0 13,15,17,19,21,23 * * 1-5'
  #   - cron: '0 1 * * 2-6'
permissions:
  contents: read
concurrency:
  group: ctw-metricool-5822365
  cancel-in-progress: false
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
      METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
      METRICOOL_BLOG_ID: '5822365'
      METRICOOL_TIMEZONE: America/Bogota
      TIMEZONE: America/Bogota
      ENABLE_SCHEDULE: 'false'
      DRY_RUN: 'true'
      REQUIRE_COVER_FOR_SCHEDULE: 'false'
      SCHEDULE_EXCLUDE_CHANNELS: Newsletter,LinkedIn Majo,IG Nico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -e '.[dev]'
      - name: Set temporary Drive credential path
        run: echo "GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE=$RUNNER_TEMP/gdrive-sa.json" >> "$GITHUB_ENV"
      - name: Optional Drive service account
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('GDRIVE_SA_JSON', '')
          if value:
              target = Path(os.environ['GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE'])
              target.write_text(value)
              target.chmod(0o600)
          PY
      - name: Offline tests
        run: |
          pytest -q
          ruff check src tests
      - name: Schedule dry-run (no publication)
        run: python -m metricool_sync_posts.cli.schedule --enable --dry-run --exclude-channel 'IG Nico'
      - name: Confirm published dry-run
        run: python -m metricool_sync_posts.cli.confirm_published --dry-run
      - name: Sync dates dry-run
        run: python -m metricool_sync_posts.cli.sync_dates --dry-run
      - name: Remove service account
        if: always()
        run: rm -f "$GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE"
