name: lint

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check src tests
      - run: pip install -e ".[dev]"
      - run: pytest -q
