[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metricool-sync-posts"
version = "0.1.0"
description = "Notion ↔ Metricool sync jobs (schedule, publish confirm, date sync) without LLM cost"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "notion-client>=2.2.1",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "tzdata>=2024.1",
  "google-auth>=2.29.0",
]

[project.optional-dependencies]
ffmpeg = [
  "imageio-ffmpeg>=0.5.1",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
]

[tool.setuptools.package-data]
metricool_sync_posts = ["BUILD.txt", "py.typed"]

[project.scripts]
notion-aprobado-metricool = "metricool_sync_posts.cli.schedule:main"
notion-publicado-metricool = "metricool_sync_posts.cli.confirm_published:main"
notion-sync-fechas-metricool = "metricool_sync_posts.cli.sync_dates:main"
metricool-discover = "metricool_sync_posts.cli.discover:main"
metricool-discover-schema = "metricool_sync_posts.cli.discover_schema:main"
metricool-validate-env = "metricool_sync_posts.cli.validate_env:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
